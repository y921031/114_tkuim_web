<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 12 - 登入系統</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; }
    .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
    h2 { text-align: center; color: #333; }
    input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; }
    button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    .hint { font-size: 0.8rem; color: #666; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>登入</h2>
    <form id="login-form">
      <input type="email" id="email" placeholder="Email (admin@example.com)" required>
      <input type="password" id="password" placeholder="密碼 (week12-pass)" required>
      <button type="submit">登入</button>
    </form>
    
    <div class="hint">
      <p>還沒有帳號？請使用 Postman 打 /auth/signup 註冊</p>
    </div>
  </div>

  <script src="./js/login.js"></script>
</body>
</html>
